[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-bbp"
version = "0.1.0"
description = "Scope-first autonomous bug-bounty research agent"
requires-python = ">=3.10"
dependencies = []  # core scope engine has zero runtime deps

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
