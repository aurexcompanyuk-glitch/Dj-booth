[project]
name = "hermes-trading"
version = "0.1.0"
description = "Self-improving BTC/USDT paper trading agent powered by Hermes"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
hermes-trading = "hermes_trading.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading"]
