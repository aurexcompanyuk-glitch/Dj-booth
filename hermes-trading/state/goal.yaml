asset: "BTC/USDT"
target_return_daily: 0.50      # success: +50% per day (leveraged paper trading)
max_drawdown: 0.15             # failure: bail above 15% drawdown
min_sharpe: 1.2                # quality bar — strong risk-adjusted return
failure_below: -0.04           # score floor — steeply negative below this
reflection_every: 5            # reflect and adapt every 5 closed trades
one_variable_only: true        # scientific-method guardrail
leverage: 10                   # default leverage multiplier (paper mode only)
mastery_threshold: 0.90        # score needed for exploit-mode trigger
mastery_cycles: 3              # consecutive cycles above threshold = mastery
